services:
    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: fixly
            POSTGRES_PASSWORD: fixly
            POSTGRES_DB: fixly_crm
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - '5000:5000'
        env_file:
            - ./backend/.env
        environment:
            DATABASE_URL: postgresql://fixly:fixly@postgres:5432/fixly_crm
        depends_on:
            - postgres
        develop:
            watch:
                - action: sync
                  path: ./backend
                  target: /app
                  ignore:
                      - node_modules/
                - action: rebuild
                  path: ./backend/package.json

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '5173:5173'
        env_file:
            - ./frontend/.env
        depends_on:
            - backend
        develop:
            watch:
                - action: sync
                  path: ./frontend
                  target: /app
                  ignore:
                      - node_modules/
                - action: rebuild
                  path: ./frontend/package.json

volumes:
    pgdata:
